<!DOCTYPE html>
<html>

    <head>
        <title>My First Game</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body class="body" onload="idleAnimationStart(); createEnemy();" onkeypress="keyCheck(event);">
        <div class ="background" id="background">
            
                <img src="resources/Idle (1).png" class="santa" id="santa"/>
                
                <div class="score" id="score" >0</div>
                <div class="start" id="start">Press ENTER to Play.</div>
            
        </div>

        <div class="end" id="end">
            <div>Game Over.</div>
            <div style="color: darkblue;">Your Score</div>
            <div style="color: green;" id="endScore">0</div>
            <button class="btn" onclick="reload();">Try Again.</button>
        </div>

        <div class="won" id="won">
            <div>Victory!</div>
            <div style="color: darkblue;">Your Score</div>
            <div style="color: green;" id="wonScore">0</div>
            <button class="btn" onclick="reload();">Play Again.</button>
        </div>

        
        
        <script src="script.js"/>
    </body>

</html>
